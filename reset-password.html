<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password : Focus Sathi</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>
<!-- for body css of the page  -->
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh;">

    <div class="auth-box" style="max-width:380px; width:100%;">
        <h2 class="auth-title">Set Your New Password Sathii</h2>
        <p class="auth-sub">Enter your new password below Mr </p>
        <input type="password" id="reset-new-password" placeholder="New Password" />
        <input type="password" id="reset-confirm-password" placeholder="Confirm New Password" />
        <div id="reset-error" class="auth-error-msg"></div>
        <div id="reset-success" class="auth-success-msg"></div>
        <button id="reset-submit">Update Password</button>
    </div>

    <script src="supabase.js"></script>
    <script src="resetgrum.js"></script>
</body>
</html>
