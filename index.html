<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sathi_Focus</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="main-container">
        <div class="calender-container">
            <div class="calender-header">
                <div class="calender-nav-buttons">
                    <button class="calnav-btn" id="Prev-month"> <i class="fa-solid fa-left-long"></i></button>
                    <button class="calnav-btn" id="next-month"> <i class="fa-solid fa-right-long"></i></button>
                </div>
                <div class="moth-year" id="month-year"> April 2026 </div>
            </div>
            <div class="week-days">
                <div class="weekday">Sun</div>
                <div class="weekday">Mon</div>
                <div class="weekday">Tue</div>
                <div class="weekday">Wed</div>
                <div class="weekday">Thu</div>
                <div class="weekday">Fri</div>
                <div class="weekday">Sat</div>
            </div>
            <div class="days" id="days"></div>
            <div class="calender-footer">
                <button class="today-btn" id="today-btn"> today</button>
                <div class="event-indicator">
                    <span>Has events comming</span>
                </div>
            </div>
        </div>

        <!-- event dekhaunih thau -->
        <div class="event-panel" id="event-panel">
            <div class="event-header">
                <div class="event-date" id="event-date">Select a date</div>
                <i class="fas fa-calendar-alt event-icon"></i>
            </div>
            <div class="event-list" id="event-list">
                <div class="no-events"> Please select a date to view them here</div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>>
